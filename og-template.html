<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #faf8f4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px 100px;
    position: relative;
  }
  .name {
    font-size: 72px;
    font-weight: 700;
    color: #1e211a;
    line-height: 1.05;
    letter-spacing: -2px;
    margin-bottom: 16px;
  }
  .name .dot {
    color: #c5a55a;
  }
  .tagline {
    font-size: 32px;
    color: #8a8578;
    font-weight: 400;
    line-height: 1.3;
    margin-bottom: 40px;
    max-width: 800px;
  }
  .tags {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .tag {
    background: #c5a55a15;
    border: 1px solid #c5a55a40;
    color: #8a7a4a;
    padding: 10px 24px;
    border-radius: 100px;
    font-size: 18px;
    font-weight: 500;
  }
  .accent-line {
    position: absolute;
    top: 60px;
    left: 100px;
    width: 60px;
    height: 4px;
    background: #c5a55a;
    border-radius: 2px;
  }
  .corner {
    position: absolute;
    bottom: 60px;
    right: 100px;
    font-size: 18px;
    color: #b0a99a;
    font-weight: 400;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="accent-line"></div>
    <div class="name">Djaouad Frih<span class="dot">.</span></div>
    <div class="tagline">Web & Mobile Developer with AI Integration</div>
    <div class="tags">
      <span class="tag">React / Next.js</span>
      <span class="tag">React Native</span>
      <span class="tag">AI / LLM</span>
      <span class="tag">Full Stack</span>
    </div>
    <div class="corner">djaouad.netlify.app</div>
  </div>
</body>
</html>
